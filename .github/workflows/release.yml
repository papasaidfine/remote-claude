name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Build jobs publish straight to the release rather than handing files to a
# collector job through actions/upload-artifact. Artifacts only exist to move a
# file between two runners, and they are billed against the account's Actions
# storage now that this repo is private — 2.34GB of dead intermediates once
# filled the quota and blocked every release. Uploading to the release instead
# means nothing is ever written to that storage, and release assets are not
# counted at all.
#
# The release has to exist before anything can upload to it, but a release that
# appears the moment the build starts is one you have to delete by hand when a
# platform fails. So it is created as a DRAFT — invisible on the releases page —
# and only flipped live once every platform has uploaded. A failed build takes
# the draft down with it.
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotent, so re-running a failed release does not error out here.
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --draft --title "$TAG" --notes ""

  # CGO-free CLI, cross-compiled for every target.
  cli:
    needs: create
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          out="remote-claude_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o "$out" ./cmd/remote-claude
          sha256sum "$out" > "$out.sha256"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # The glob is this job's own targets only, so parallel jobs never write
        # the same asset. --clobber makes a re-run idempotent.
        run: gh release upload "$TAG" remote-claude_${{ matrix.goos }}_${{ matrix.goarch }}* --clobber

  # Native Fyne GUI — needs CGO, so build on each OS's own runner.
  gui:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  suffix: linux_amd64,   ext: '',   ldflags: '' }
          - { os: macos-latest,   suffix: darwin_arm64,  ext: '',   ldflags: '' }
          # -H=windowsgui → GUI subsystem, so no console window pops up.
          - { os: windows-latest, suffix: windows_amd64, ext: .exe, ldflags: '-H=windowsgui' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev
      - name: Build GUI
        shell: bash
        env:
          CGO_ENABLED: '1'
          # The repository is private, so the in-app updater has to authenticate
          # to read releases and download assets. The credential is stamped in
          # here rather than committed, so rotating it means changing this
          # secret, not the source. Repository secret — an environment secret
          # would not resolve, as this job declares no `environment:`.
          RC_UPDATE_TOKEN: ${{ secrets.RC_UPDATE_TOKEN }}
        run: |
          # Without the token the build still succeeds — it just ships an app
          # whose "Check for updates" 404s against the private repo. Fail loudly
          # instead of publishing that.
          if [ -z "$RC_UPDATE_TOKEN" ]; then
            echo "::error::RC_UPDATE_TOKEN repository secret is not set; the release would ship an app that cannot check for updates."
            exit 1
          fi
          out="remote-claude-gui_${{ matrix.suffix }}${{ matrix.ext }}"
          tokenvar="github.com/papasaidfine/remote-claude/internal/selfupdate.token"
          # On Windows the icon comes from cmd/remote-claude-gui/rsrc_windows_amd64.syso
          # (the Go linker embeds it automatically — no flag needed).
          go build -tags gui -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }} -X $tokenvar=$RC_UPDATE_TOKEN ${{ matrix.ldflags }}" \
            -o "$out" ./cmd/remote-claude-gui
          sha256sum "$out" > "$out.sha256"
      # macOS: also wrap the binary in a proper .app (with an .icns icon) and a
      # .dmg — the bare Unix binary can't carry an icon. The bare binary is kept
      # too, so in-app self-update still works.
      - name: Package macOS .app + .dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          bin="remote-claude-gui_${{ matrix.suffix }}"
          app="remote-claude.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$bin" "$app/Contents/MacOS/remote-claude"
          chmod +x "$app/Contents/MacOS/remote-claude"
          # icon.icns from the committed PNG
          iconset="icon.iconset"; mkdir -p "$iconset"
          src="cmd/remote-claude-gui/Icon.png"
          sips -z 16 16   "$src" --out "$iconset/icon_16x16.png"      >/dev/null
          sips -z 32 32   "$src" --out "$iconset/icon_16x16@2x.png"   >/dev/null
          sips -z 32 32   "$src" --out "$iconset/icon_32x32.png"      >/dev/null
          sips -z 64 64   "$src" --out "$iconset/icon_32x32@2x.png"   >/dev/null
          sips -z 128 128 "$src" --out "$iconset/icon_128x128.png"    >/dev/null
          sips -z 256 256 "$src" --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$src" --out "$iconset/icon_256x256.png"    >/dev/null
          sips -z 512 512 "$src" --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$src" --out "$iconset/icon_512x512.png"    >/dev/null
          cp "$src" "$iconset/icon_512x512@2x.png"
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/icon.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>remote-claude</string>
          <key>CFBundleDisplayName</key><string>remote-claude</string>
          <key>CFBundleExecutable</key><string>remote-claude</string>
          <key>CFBundleIdentifier</key><string>com.papasaidfine.remote-claude</string>
          <key>CFBundleIconFile</key><string>icon</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>${ver}</string>
          <key>CFBundleVersion</key><string>${ver}</string>
          <key>LSMinimumSystemVersion</key><string>10.15</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$app" || true   # ad-hoc sign (no cert)
          # Stage the .app next to an /Applications symlink so the mounted dmg
          # shows the standard "drag me into Applications" install target.
          stage="dmg-stage"; mkdir -p "$stage"
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          dmg="remote-claude-gui_${{ matrix.suffix }}.dmg"
          hdiutil create -volname "remote-claude" -srcfolder "$stage" -ov -format UDZO "$dmg" >/dev/null
          sha256sum "$dmg" > "$dmg.sha256"
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # Picks up the bare binary, the .dmg on macOS, and every .sha256 beside
        # them — all prefixed with this platform's suffix, so parallel jobs
        # never write the same asset.
        run: gh release upload "$TAG" remote-claude-gui_${{ matrix.suffix }}* --clobber

  # Everything built and uploaded — make the release visible.
  publish:
    needs: [cli, gui]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          # The release title is just the tag (e.g. "v0.2.0"). A tag with a
          # pre-release suffix (v0.2.0-rc.1) is a pre-release; a bare tag is a
          # full release and becomes "Latest".
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: gh release edit "$TAG" --draft=false --prerelease=$PRERELEASE

  # Any job above failed, so the draft is empty or half-filled. Take it down
  # rather than leaving it to be deleted by hand. The tag is left alone.
  discard:
    needs: [create, cli, gui]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Discard the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Only ever deletes a draft, so a re-run can never remove a release
          # that already went live.
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo "")
          if [ "$draft" = "true" ]; then
            gh release delete "$TAG" --yes
            echo "discarded the draft release for $TAG"
          fi
